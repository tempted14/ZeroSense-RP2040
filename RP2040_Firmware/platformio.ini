; ZeroSense firmware - RP2040 output device and RP2350 mouse proxy
; Arduino-Pico with Adafruit TinyUSB integration.

[platformio]
; Keep toolchain/framework packages project-local so a partial global cache cannot
; poison this build. The directory is ignored and can be regenerated at any time.
packages_dir = .pio/packages
default_envs = waveshare_rp2040_zero, waveshare_rp2350_usb_c

[env:waveshare_rp2040_zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a
board = waveshare_rp2040_zero
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

build_flags =
    -DUSE_TINYUSB

[env:waveshare_rp2350_usb_c]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a
board = waveshare_rp2350_usb_c
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 120000000L
monitor_speed = 115200

build_flags =
    -DUSE_TINYUSB
    -DZEROSENSE_RP2350_USB_C

lib_deps =
    https://github.com/sekigon-gonnoc/Pico-PIO-USB.git#5a37a66dc5d3fbe0ef3cdbeda923a757440f984f
