; ZeroSense firmware - RP2040 output device and RP2350 mouse proxy
; Arduino-Pico with Adafruit TinyUSB integration.

[platformio]
; Keep toolchain/framework packages project-local so a partial global cache cannot
; poison this build. The directory is ignored and can be regenerated at any time.
packages_dir = .pio/packages
default_envs = waveshare_rp2040_zero, waveshare_rp2350_usb_c

[env:waveshare_rp2040_zero]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a
board = waveshare_rp2040_zero
framework = arduino
lib_ignore = Pico PIO USB
board_build.core = earlephilhower
monitor_speed = 115200

build_flags =
    -DUSE_TINYUSB
    ; Exact profile/sensitivity acknowledgements contain three-decimal floats.
    ; PlatformIO does not inherit Arduino-Pico's platform.txt linker flags, so
    ; explicitly retain newlib-nano's floating-point printf implementation.
    -Wl,-u,_printf_float

[env:waveshare_rp2350_usb_c]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a
board = waveshare_rp2350_usb_c
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 120000000L
monitor_speed = 115200

build_flags =
    -DUSE_TINYUSB
    -DZEROSENSE_RP2350_USB_C
    ; Keep exact readback fields (for example V=0.525 and H=1.000) available
    ; instead of silently emitting empty values for %f conversions.
    -Wl,-u,_printf_float

; Pico PIO USB is vendored under lib/ at the pinned upstream commit. The local
; copy carries a targeted host EOP race fix; keep its provenance in lib/README.md.
lib_deps =
    adafruit/Adafruit TinyUSB Library@3.7.7
