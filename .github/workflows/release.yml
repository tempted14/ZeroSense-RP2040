name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag and application versions
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          [xml]$buildProperties = Get-Content Directory.Build.props
          $projectVersion = [string]$buildProperties.Project.PropertyGroup.Version
          [xml]$manifest = Get-Content WindowsApp/app.manifest
          $manifestVersion = ([string]$manifest.assembly.assemblyIdentity.version) -replace '\.0$', ''
          if ($tagVersion -ne $projectVersion -or $tagVersion -ne $manifestVersion) {
            throw "Tag $tagVersion, project $projectVersion, and manifest $manifestVersion must match."
          }
      - name: Restore and test
        shell: pwsh
        run: |
          dotnet restore Tests/RainbowRecoil.CoreTests.csproj --configfile NuGet.Config
          dotnet restore WindowsApp/RainbowRecoil.csproj --runtime win-x64 --configfile NuGet.Config
          dotnet run --project Tests/RainbowRecoil.CoreTests.csproj --configuration Release --no-restore
          python -m unittest discover -s Tests -p "test_*.py" -v
      - name: Publish portable Windows package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $appOutput = Join-Path $PWD "dist/app"
          dotnet publish WindowsApp/RainbowRecoil.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            --no-restore --output $appOutput -p:WindowsAppSDKSelfContained=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "$appOutput/*" `
            -DestinationPath "dist/ZeroSense-$version-Windows-x64.zip" -Force
      - name: Detect signing configuration
        id: signing
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw "Both Windows signing secrets must be configured together."
          }
          "available=$($hasCertificate.ToString().ToLowerInvariant())" | Out-File `
            -FilePath $env:GITHUB_OUTPUT -Append
      - name: Install Inno Setup for signed installer
        if: steps.signing.outputs.available == 'true'
        run: choco install innosetup --no-progress -y
      - name: Materialize signing certificate
        if: steps.signing.outputs.available == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) { throw "Signing certificate secret is required." }
          $path = Join-Path $env:RUNNER_TEMP "zerosense-signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
          "ZEROSENSE_SIGNING_CERTIFICATE=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build and sign installer
        if: steps.signing.outputs.available == 'true'
        shell: pwsh
        env:
          ZEROSENSE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./tools/build_release.ps1 -Version $version -SkipFirmware
      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            dist/ZeroSense-*-Windows-x64.zip
            dist/ZeroSense-Setup-*.exe
          if-no-files-found: error

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install platformio==6.2.0
      - name: Run native HID replay fixtures
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          Tests/HidReplay/hid_replay_tests.cpp
          -o Tests/HidReplay/hid_replay_tests
          && Tests/HidReplay/hid_replay_tests
      - run: pio run -d RP2040_Firmware -e waveshare_rp2040_zero -e waveshare_rp2350_usb_c
      - name: Name and validate UF2s
        run: |
          version="${GITHUB_REF_NAME#v}"
          python tools/verify_uf2.py rp2040 RP2040_Firmware/.pio/build/waveshare_rp2040_zero/firmware.uf2
          python tools/verify_uf2.py rp2350 RP2040_Firmware/.pio/build/waveshare_rp2350_usb_c/firmware.uf2
          cp RP2040_Firmware/.pio/build/waveshare_rp2040_zero/firmware.uf2 "ZeroSense-RP2040-Zero-$version.uf2"
          cp RP2040_Firmware/.pio/build/waveshare_rp2350_usb_c/firmware.uf2 "ZeroSense-RP2350-USB-C-$version.uf2"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-uf2
          path: ZeroSense-*.uf2

  publish:
    needs: [windows, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Build one-download starter bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          python tools/build_starter_bundle.py \
            --assets release-assets \
            --version "$version" \
            --quick-start docs/START_HERE.txt
      - name: Refresh combined checksums
        working-directory: release-assets
        run: sha256sum ZeroSense-* > SHA256SUMS.txt
      - name: Publish tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-assets/*
          --repo "${{ github.repository }}"
          --verify-tag
          --title "ZeroSense ${{ github.ref_name }}"
          --notes-file "docs/RELEASE_NOTES_${GITHUB_REF_NAME#v}.md"
